version: "3"

tasks:
  install_tools:
    desc: Install all dependencies for the project
    cmds:
      - chmod +x ./scripts/install-tools.sh
      - ./scripts/install-tools.sh

  sync:
    desc: Install the exact dependencies in the lockfiles (run after cloning or pulling)
    cmds:
      - go mod download
      - pnpm install --frozen-lockfile

  upgrade:
    desc: Upgrade all dependencies to their latest versions and update the lockfiles
    cmds:
      - go get -u ./...
      - go mod tidy
      - pnpm update --latest

  run_ci:
    desc: Run the CI pipeline locally
    cmds:
      - act -n

  test:
    desc: Run tests
    cmds:
      - go test ./... -v

  format:
    desc: Run formatters only
    cmds:
      - gofumpt -w .
      - goimports -w .

  lint:
    desc: Run linters
    cmds:
      - golangci-lint run ./... --fix
    deps: [format]

  deadcode:
    desc: Check for dead code
    cmds:
      - deadcode --test ./...

  security:
    desc: Run security vulnerability scan
    cmds:
      - govulncheck ./...
